num_trials: 1000
base_seed: 1765220306
output_csv: "coverage_results.csv"

geometry:
  M: 5 
  x_agents_min: -1.5
  x_agents_max: -1.5
  y_agents_min: -0.8
  y_agents_max: 0.8
  x_target_min: -1.0
  x_target_max: 4.5
  y_target_min: -4.5
  y_target_max: 4.5

fov:
  theta_h_min_deg: 2.5
  theta_h_max_deg: 2.5

# epoch grid to search over
epochs:
  dt_min: 10.0
  dt_max: 6000.0
  n_dt: 600

# random target motion
motion:
  v_min: [-0.02, -0.02]
  v_max: [ 0.02,  0.02]
  a_min: [-0.0005, -0.0005]
  a_max: [ 0.0005,  0.0005]

covariance:
  d_mahal: 3.0
  sigma_ra0_deg: 4.4
  sigma_dec0_deg: 2.31
  sigma_rho0: 1.28
  growth_rate: 0.002
  i_ref: 0

optimizer:
  kappa_sigma: 1500.0
  n_mc: 20000
  n_restarts: 1

ems:
  p_em: [0.0, 0.0, 0.0]
  R_em: 0.5
  alpha_s_deg: 5
  lambda_em: 1.0
  beta_zeta: 115.0

# slew/actuator model (your constants)
slew_model:
  tau_max: 0.004
  h_max: 0.015
  m_m: 50
  l_m: 0.5
  m_t: 5
  d_t: 0.28
  z_0: 0.3
